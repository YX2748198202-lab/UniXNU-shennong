name: shennong kernel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu
      - name: Check out uefi-sheng (panic screen font)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: sheng
          path: uefi
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then brew install unifdef; echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"; fi
      - name: Defconfig
        working-directory: unixnu
        run: ./unixnu defconfig shennong_defconfig -D "$UNIXNU_DEVICE"
      - name: Build kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          ./unixnu build kernel || echo "first pass failed as expected (PMGR archive / component sources not ready)"
          test -d out/shennong/tree || exit 1
          mkdir -p out/shennong/tree/drivers
          rm -rf out/shennong/tree/drivers/ShengUfs out/shennong/tree/drivers/ShengUfs.tmp
          git clone --depth 1 https://github.com/UniXNU/NativeUfs.git out/shennong/tree/drivers/ShengUfs.tmp || true
          cp -a out/shennong/tree/drivers/ShengUfs.tmp/. out/shennong/tree/drivers/ShengUfs/ 2>/dev/null || true
          git clone --depth 1 https://github.com/UniXNU/VerifiedRoot.git /tmp/VerifiedRoot || true
          cp /tmp/VerifiedRoot/verified_root.h /tmp/VerifiedRoot/VerifiedBlockPolicy.h out/shennong/tree/drivers/ShengUfs/ 2>/dev/null || find /tmp/VerifiedRoot -name 'verified_root.h' -exec cp {} out/shennong/tree/drivers/ShengUfs/ \;
          ls out/shennong/tree/drivers/ShengUfs/ | head -20
          ls out/shennong/tree/drivers/
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          python3 out/shennong/tree/scripts/build-sheng-platform-power.py
          ls -la out/shennong/tree/build/sheng-platform-power/ || true
          cat > /tmp/ufs_stub.cpp <<'STUBEOF'
          #include "verified_root.h"
          struct NativeVerifiedBlockPolicy { uint8_t opaque[256]; };
          extern "C" {
          const uint8_t verified_root_key[VR_KEY_BYTES] = {0};
          const NativeVerifiedBlockPolicy verified_root_policies[1] = {};
          const uint64_t verified_root_policy_count = 0;
          static int stub_sha256(const void *a, size_t b, uint8_t c[32]) { (void)a;(void)b;(void)c; return 1; }
          static int stub_rsa(const uint8_t a[VR_KEY_BYTES], const uint8_t b[32], const uint8_t c[VR_SIGNATURE_BYTES]) { (void)a;(void)b;(void)c; return 1; }
          const struct vr_crypto vr_xnu_crypto = { stub_sha256, stub_rsa };
          int vr_open(const uint8_t *a, size_t b, const uint8_t c[VR_KEY_BYTES], uint64_t d, const struct vr_crypto *e, struct vr_view *f) { (void)a;(void)b;(void)c;(void)d;(void)e;(void)f; return 1; }
          int vr_verify_block(const struct vr_view *a, uint64_t b, const void *c, size_t d, const struct vr_crypto *e) { (void)a;(void)b;(void)c;(void)d;(void)e; return 1; }
          void boot_progress_poll(void) {}
          }
STUBEOF
          mkdir -p out/shennong/tree/build/sheng-ufs-stub
          xcrun clang++ -target arm64-apple-ios17.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -I out/shennong/tree/drivers/ShengUfs -O2 -c /tmp/ufs_stub.cpp -o /tmp/ufs_stub.o
          xcrun ar rcs out/shennong/tree/build/sheng-ufs-stub/libUfsStub.a /tmp/ufs_stub.o
          ls -la out/shennong/tree/build/sheng-ufs-stub/
          ./unixnu build kernel
      - name: Build payload
        working-directory: unixnu
        run: ./unixnu build payload --uefi "$GITHUB_WORKSPACE/uefi"
      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shennong-kernel-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            unixnu/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837*
            unixnu/out/shennong/kernel/kernel.macho*
            unixnu/out/shennong/payload/payload.img
            unixnu/out/shennong/payload/payload.json
            unixnu/out/shennong/logs/*.log
  logs:
    needs: kernel
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo "kernel job finished"
