name: shennong kernel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          # Pinned: upstream main moved drivers/ArmCpu to a commit that no longer exists
          # (force-pushed away), so "ref: main" fails in the submodule fetch before any
          # board code runs. This commit is the one every successful shennong build used.
          ref: c740efb5b23e94453bb179f7801eb592baafacf6
          path: unixnu
          submodules: recursive
      - name: Check out uefi-sheng (panic screen font)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: sheng
          path: uefi
          # Mu_Basecore is the EDK2 tree DarwinBoot builds against.
          submodules: recursive
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          if ! command -v unifdef >/dev/null; then brew install unifdef; echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"; fi
      - name: Install the board OS profile
        run: |
          # The profile for this board's userland lives in the device repository; the framework
          # only resolves profiles from its own tree, so install it before anything reads it.
          mkdir -p unixnu/profiles/os
          cp -r device/profiles/os/* unixnu/profiles/os/ 2>/dev/null || true
          ls unixnu/profiles/os
      - name: Fetch device modules
        working-directory: unixnu
        run: ./unixnu fetch -D "$UNIXNU_DEVICE"
      - name: Defconfig
        working-directory: unixnu
        run: ./unixnu defconfig shennong_defconfig -D "$UNIXNU_DEVICE"
      - name: Build kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
          # The board has no serial port and no display driver in XNU yet, so the framebuffer
          # stage screen is the only channel that says how far the kernel got. It is compiled
          # in only when this is 1; build-xnu-4k-baseline.sh defaults it to 0 and the previous
          # image therefore carried the archive but none of the calls (build log: "env: unset").
          XNU_BOOT_PROGRESS: '1'
        run: |
          trap 'echo "::error::Build kernel failed at line $LINENO: $BASH_COMMAND"' ERR
          SRC_SCRIPT=scripts/build-xnu-4k-baseline.sh
          # symbols helper must tolerate objects the failed link pass removed
          SYMFILE=scripts/xnu_symbols.py
          if [ -f "$SYMFILE" ] && ! grep -q 'if Path(path).is_file()' "$SYMFILE"; then
            sed -i '' 's|paths = \[str(path) for path in paths\]|paths = [str(path) for path in paths if Path(path).is_file()]|' "$SYMFILE" || true
          fi
          echo "symbols-helper patched: $(grep -c 'if Path(path).is_file()' "$SYMFILE" || true)"
          # The diagnostic screen is gated on the audited UFS/owner-root build, which this board
          # does not run yet. The screen only needs the stage/console/panic display, so relax that
          # gate for this board and say so in the log.
          if grep -q 'Boot progress requires the audited' "$SRC_SCRIPT"; then
            sed -i '' 's/^  if \[ "\${XNU_NATIVE_UFS:-0}" != 1 \].*/  if false; then/' "$SRC_SCRIPT" || true
            sed -i '' '/^     \[ "\${XNU_SOURCE_CORECRYPTO14:-0}" != 1 \]; then$/d' "$SRC_SCRIPT" || true
            echo "boot-progress gate patched: $(grep -c 'if false; then' "$SRC_SCRIPT" || true)"
          fi
          # The UFS driver's inherited IOStorageFamily slots and the VerifiedRoot
          # crypto come from two archives the upstream build script never adds to the
          # kernel link: it only knows the archives behind its own switches. Force-load
          # them when they are there, before the first pass.
          # This kernelcache leaves no slack for the native constant segment. Apple's own
          # kernel fills __DATA_CONST (0xdc000) plus the __LASTDATA_CONST page exactly, so
          # only 0xe0000 bytes exist between the collection's __DATA_CONST start and the
          # first retained kext constant (com.apple.kec.pthread at +0xe0000). XNU requires
          # the kext constants to start at the end of the kernel's __LASTDATA_CONST
          # (arm_init_sptm: segPLKDATACONSTB = segLASTDATACONSTB + segSizeLASTDATACONST),
          # so the DEVELOPMENT kernel's __const cannot simply be placed at the start.
          # Move that section into __KLDDATA at link time: the kernel maps __KLDDATA
          # read-only in arm_vm_init (arm_vm_page_granular_RNX) before any constant is
          # read, and the prelink layout allocates __KLDDATA past the end of the file,
          # where it has unlimited room. Probe the linker first; fall back to the classic
          # linker, and warn instead of failing the build when neither accepts the flag.
          export XNU_CONST_RENAME=""
          cat > /tmp/linkcheck.c <<'EOF'
          static const char *const linkcheck_table[] = { "a", "b" };
          int main(void) { return linkcheck_table[0][0]; }
          EOF
          for _variation in \
            "-Wl,-rename_section,__DATA_CONST,__const,__KLDDATA,__const" \
            "-Wl,-ld_classic,-rename_section,__DATA_CONST,__const,__KLDDATA,__const"; do
            if xcrun --sdk macosx clang /tmp/linkcheck.c -o /tmp/linkcheck $_variation >/tmp/linkcheck.log 2>&1; then
              export XNU_CONST_RENAME="$_variation"
              break
            fi
            echo "linker check failed for: $_variation"
            tail -3 /tmp/linkcheck.log | sed 's/^/    /'
          done
          if [ -n "$XNU_CONST_RENAME" ]; then
            echo "const section move: linker accepts $XNU_CONST_RENAME"
          else
            echo "::warning::no linker support for -rename_section; kernel constant move unavailable"
          fi
          python3 - "$SRC_SCRIPT" <<'PY'
          import os
          import sys
          from pathlib import Path
          script = Path(sys.argv[1])
          text = script.read_text()
          if 'libStorageBindings.a' in text:
              print('storage archive link patch: already present')
          else:
              anchor = '  KERNEL_EXTRA_ARCHIVES="$KERNEL_EXTRA_ARCHIVES ${XNU_EXTRA_LD_ARCHIVES:-}"'
              if anchor not in text:
                  print('::error::storage archive link patch: anchor not found')
              else:
                  inject = ('  for _extra in "$ROOT/build/verified-root/libVerifiedRoot.a" '
                            '"$ROOT/build/io-storage-family/libStorageBindings.a"; do\n'
                            '    [ -f "$_extra" ] && KERNEL_EXTRA_ARCHIVES="$KERNEL_EXTRA_ARCHIVES -Wl,-force_load,$_extra"\n'
                            '  done\n')
                  script.write_text(text.replace(anchor, inject + anchor, 1))
                  print('storage archive link patch: applied')
          flag = os.environ.get('XNU_CONST_RENAME', '').strip()
          if flag:
              text = script.read_text()
              if flag in text:
                  print('const section move: already present')
              else:
                  anchor = '  KERNEL_EXTRA_ARCHIVES="$KERNEL_EXTRA_ARCHIVES ${XNU_EXTRA_LD_ARCHIVES:-}"'
                  if anchor not in text:
                      print('::error::const section move: anchor not found')
                  else:
                      inject = '  KERNEL_EXTRA_ARCHIVES="$KERNEL_EXTRA_ARCHIVES %s"\n' % flag
                      script.write_text(text.replace(anchor, inject + anchor, 1))
                      print('const section move: applied', flag)
          PY
          # The prelink kit relocates native split-segment references through
          # LC_SEGMENT_SPLIT_INFO. A kernel linked without that command has no such
          # references at all, so its absence is not an error: every pointer still moves
          # through the chained-fixup pass in relocate_native. Only the case where the
          # image has neither records nor chained fixups is a real failure.
          python3 - kits/XnuPrelink/fileset_layout.py <<'PY'
          import sys
          from pathlib import Path
          OLD = "        raise ValueError('Native image has no split-segment relocation information')"
          NEW = ("        if not image.fixups():\n"
                 "            raise ValueError('Native image has neither split-segment records nor chained fixups')\n"
                 "        return")
          path = Path(sys.argv[1])
          if not path.is_file():
              print('::warning::split-segment tolerance: kit not at', path)
          else:
              text = path.read_text()
              if NEW in text:
                  print('split-segment tolerance: already present')
              elif OLD in text:
                  path.write_text(text.replace(OLD, NEW, 1))
                  print('split-segment tolerance: applied')
              else:
                  print('::warning::split-segment tolerance: pattern not found')
          PY
          if ./unixnu build kernel; then
            FIRST_RC=0
            echo "first pass rc=0"
          else
            FIRST_RC=$?
            echo "::warning::first pass rc=$FIRST_RC (bootstrap; expected to fail only while libShengPlatformPower.a is absent)"
          fi
          TREE=$(ls -d out/shennong/*/shennong/tree 2>/dev/null | head -1)
          echo "tree=$TREE"
          test -d "$TREE" || exit 1
          # The pinned ShengUfs refuses to boot when the firmware left its own stream
          # mapped to a context bank with translation on; the reference marble port
          # takes that exclusive bank over instead. Apply the board patch to the tree
          # before the second pass rebuilds the driver archive.
          if [ -f "$GITHUB_WORKSPACE/device/patches/ufs-smmu-takeover.patch" ]; then
            ( cd "$TREE" && patch -p1 --forward < "$GITHUB_WORKSPACE/device/patches/ufs-smmu-takeover.patch" ) \
              || echo "::warning::UFS SMMU takeover patch did not apply"
            grep -c "takeover" "$TREE/drivers/ShengUfs/SmmuTakeover.h" | sed 's/^/ufs takeover hits: /'
          fi
          # Root publication used to be fire-and-forget; on this board the mount that follows
          # sometimes beat it and the same image panicked with "Failed to mount root device".
          # The patch makes startRoot wait, bounded, for the publisher thread.
          # Which source does the boot-progress archive compile from, and does it carry
          # the STAGE line? The last round proved the pushed package/ copy has it while the
          # kernel did not, so record the resolved path and content before the second pass.
          # The package links at kits/<board kit>; the board kit is "sheng" to match the
          # framework's storage builders, but accept the older name too.
          BP_SRC="$(ls "$TREE"/kits/sheng/BootProgressMini.c "$TREE"/kits/shennong/BootProgressMini.c 2>/dev/null | head -1)"
          echo "boot progress source: $BP_SRC -> $(readlink -f "$BP_SRC" 2>/dev/null || echo missing)"
          if [ -f "$BP_SRC" ]; then
            echo "boot progress STAGE hits: $(grep -c 'STAGE ' "$BP_SRC" || true)"
            echo "boot progress line count: $(wc -l < "$BP_SRC")"
          fi
          echo "cached archive before: $(ls -l "$TREE/build/boot-progress/" 2>/dev/null | tr '\n' ' ')"
          # The second pass linked a stale libBootProgress.a: the kernel carried the old
          # BootProgressMini ([BP]/lane strings) and none of the new STAGE line even though
          # build-boot-progress.py had recompiled the source into BootProgressMini.o. Drop the
          # archive and the object so the second pass rebuilds both from kits/shennong.
          rm -f "$TREE/build/boot-progress/libBootProgress.a" "$TREE/build/boot-progress/BootProgressMini.o"
          echo "cached archive cleared: $(ls -l "$TREE/build/boot-progress/" 2>/dev/null | tr '\n' ' ')"
          echo "XNU_BOOT_PROGRESS env: ${XNU_BOOT_PROGRESS:-unset}"
          if [ -f "$GITHUB_WORKSPACE/device/patches/ufs-sync-publication.patch" ]; then
            ( cd "$TREE" && patch -p1 --forward < "$GITHUB_WORKSPACE/device/patches/ufs-sync-publication.patch" ) \
              || echo "::warning::UFS publication wait patch did not apply"
            grep -c "gRootPublicationResult" "$TREE/drivers/ShengUfs/NativeUfs.cpp" | sed 's/^/ufs publication result hits: /'
          fi
          # The driver publishes a root window only against an owner-signed policy, and this
          # board now has one: policies/ carries its own 544-byte headers and the public key,
          # so the verified path runs instead of being bypassed. Copy the bundle where
          # build-verified-root.py looks for it and drop its generated source so the archive
          # is rebuilt against it.
          mkdir -p "$TREE/build/verified-root/policies"
          cp "$GITHUB_WORKSPACE/device/policies/verified-root-key.bin" \
             "$GITHUB_WORKSPACE/device/policies/OS.policy" \
             "$GITHUB_WORKSPACE/device/policies/SystemOS.policy" \
             "$TREE/build/verified-root/policies/" 2>/dev/null || true
          rm -f "$TREE/build/verified-root/verified-root-policies.cpp"
          echo "verified-root bundle: $(ls "$TREE/build/verified-root/policies" | tr '\n' ' ')"
          mkdir -p "$TREE/drivers"
          if [ ! -f "$TREE/drivers/ShengUfs/NativeUfs.cpp" ]; then
            rm -rf "$TREE/drivers/ShengUfs"
            git clone --depth 1 https://github.com/UniXNU/NativeUfs.git "$TREE/drivers/ShengUfs" || true
          fi
          git clone --depth 1 https://github.com/UniXNU/VerifiedRoot.git /tmp/VerifiedRoot || true
          cp /tmp/VerifiedRoot/verified_root.h /tmp/VerifiedRoot/VerifiedBlockPolicy.h "$TREE/drivers/ShengUfs/". 2>/dev/null || true
          ls "$TREE/drivers/ShengUfs/" | head -20
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          # Not built: its XnuPrelink reader rejects arm64e kernels, and the iOS 27 reference
          # archive list omits it. SHENG_PMGR stays off until that reader handles arm64e.
          if [ -f "$TREE/scripts/build-mockfs-fixture.py" ]; then
            python3 "$TREE/scripts/build-mockfs-fixture.py" || echo "::warning::mockfs fixture build failed"
          else
            echo "mockfs fixture script absent (MOCKFS not enabled for this profile)"
          fi
          tail -3 "$TREE/drivers/ShengUfs/NativeUfs.cpp"
          echo "=== STORAGE ABI AUDIT ==="
          python3 "$TREE/scripts/audit-storage-interface.py" || echo "audit failed"
          echo "=== AUDIT END ==="
          ./unixnu build kernel > /tmp/pass2.log 2>&1; SECOND_RC=$?
          # The ci-logs step copies every *.log from the build's own logs directory, which is the
          # one path proven to be committed. Put the second pass there too: the job console is not
          # always reachable, and the bootstrap log alone does not describe this failure.
          # Both the tree's policy directory and the device checkout decide what the ShengUfs
          # component resolves when it calls the storage builder without --policy-dir.
          echo "tree policies: $(ls "$TREE/scripts/policies" 2>/dev/null | tr '\n' ' ')"
          echo "device policies: $(ls "$GITHUB_WORKSPACE/device/scripts/policies" 2>/dev/null | tr '\n' ' ')"
          echo "tree package -> $(readlink -f "$TREE/package" 2>/dev/null)"
          echo "tree kits: $(ls "$TREE/kits" 2>/dev/null | tr '\n' ' ')"
          echo "device package BootLog.c: $(ls -l "$GITHUB_WORKSPACE/device/package/BootLog.c" 2>&1 | head -1)"
          PASS2_LOGS="$(dirname "$TREE")/logs"
          mkdir -p "$PASS2_LOGS"
          cp -f /tmp/pass2.log "$PASS2_LOGS/pass2.log" 2>/dev/null || true
          echo "second pass log: $(wc -c < "$PASS2_LOGS/pass2.log" 2>/dev/null || echo 0) bytes at $PASS2_LOGS"
          if [ "$SECOND_RC" != 0 ]; then
            echo "::error::second pass failed"
            tail -40 /tmp/pass2.log | sed 's/^/::error::/'
          fi
          echo "second pass rc=$SECOND_RC"
          printf '%s\n' "$SECOND_RC" > /tmp/second-rc.txt
          # Did the second pass really rebuild the diagnostic archive, and did the linked
          # kernel take it? The first pass had already produced BootProgressMini.o with the
          # STAGE line, yet the shipped kernel carried only the old strings.
          echo "after pass 2: $(ls -l "$TREE/build/boot-progress/" 2>/dev/null | tr '\n' ' ')"
          if [ -f "$TREE/build/boot-progress/BootProgressMini.o" ]; then
            echo "object STAGE hits: $(strings -a "$TREE/build/boot-progress/BootProgressMini.o" | grep -c 'STAGE ' || true)"
            echo "object sha256: $(shasum -a 256 "$TREE/build/boot-progress/BootProgressMini.o" | cut -d' ' -f1)"
          fi
          if [ -f "$TREE/build/boot-progress/libBootProgress.a" ]; then
            echo "archive STAGE hits: $(strings -a "$TREE/build/boot-progress/libBootProgress.a" | grep -c 'STAGE ' || true)"
            echo "archive sha256: $(shasum -a 256 "$TREE/build/boot-progress/libBootProgress.a" | cut -d' ' -f1)"
          fi
          KM=$(ls -t "$TREE"/../kernel/kernel.macho 2>/dev/null | head -1)
          echo "kernel path: ${KM:-none}"
          if [ -n "$KM" ]; then echo "kernel STAGE hits: $(strings -a "$KM" | grep -c 'STAGE ' || true)"; fi
          echo "=== LINK ARGS DUMP ==="
          for f in $(find "$TREE" -name '*.linkarguments' 2>/dev/null | head -3); do
            echo "--- $f"
            echo "dynamic_lookup_count=$(grep -o 'dynamic_lookup' "$f" | wc -l)"
            head -c 700 "$f"
            echo
          done
          echo "=== DUMP END ==="
          for f in "$TREE"/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837*; do
            [ -f "$f" ] && echo "macho $(basename "$f") $(wc -c < "$f") bytes"
          done
          # The prelink places native segments against retained kext segments; when that
          # fails, the native sizes are the only numbers that matter. Print them here so
          # the layout failure can be read from the job log without the artifact.
          NATIVE_KERNEL="$TREE/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837"
          if [ -f "$NATIVE_KERNEL" ]; then
            echo "=== NATIVE KERNEL SEGMENTS ==="
            python3 - "$NATIVE_KERNEL" <<'PY'
          import struct
          import sys

          data = open(sys.argv[1], 'rb').read()
          count = struct.unpack_from('<I', data, 16)[0]
          at = 32
          for _ in range(count):
              cmd, size = struct.unpack_from('<II', data, at)
              if cmd == 0x19:
                  name = data[at + 8:at + 24].split(b'\0')[0].decode()
                  va, vmsize, fileoff, filesize = struct.unpack_from('<QQQQ', data, at + 24)
                  print('seg %-18s va=%#x vmsize=%#010x filesize=%#010x' % (name, va, vmsize, filesize))
                  nsects = struct.unpack_from('<I', data, at + 64)[0]
                  for index in range(nsects):
                      base = at + 72 + index * 80
                      sect = data[base:base + 16].split(b'\0')[0].decode()
                      seg = data[base + 16:base + 32].split(b'\0')[0].decode()
                      addr, sect_size = struct.unpack_from('<QQ', data, base + 32)
                      print('    %s,%s size=%#x' % (seg, sect, sect_size))
              at += size
          PY
            echo "=== END NATIVE KERNEL SEGMENTS ==="
          else
            echo "native kernel absent at $NATIVE_KERNEL"
          fi
          echo "::error::mock tree=$TREE"
          echo "::error::mock mode=$(cat "$TREE/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT/.source-mockfs-mode" 2>/dev/null || echo unset)"
          echo "::error::mock fixture=$(ls "$TREE/build/mockfs-fixture/" 2>/dev/null | tr '\n' ',')"
          echo "::error::mock cfg=$(find out -maxdepth 5 -name '.config' 2>/dev/null | head -1)"
          for f in $(find out -maxdepth 5 -name '.config' 2>/dev/null | head -1); do
            grep -E 'MOCKFS|NATIVE_UFS|SOURCE_PTHREAD' "$f" | sed 's/^/::error::mock key /'
          done
          exit $SECOND_RC
      - name: Report failure details
        if: failure()
        working-directory: unixnu
        run: |
          python3 - <<'PY'
          import glob, os
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          parts = []
          logs = sorted(glob.glob('out/shennong/**/*.log', recursive=True), key=os.path.getmtime, reverse=True)
          parts.append('LOGS n=%d first=%s' % (len(logs), ','.join(os.path.basename(x) for x in logs[:4])))
          if os.path.exists('/tmp/bsp.out'):
              parts.append('== bsp.tail')
              parts.append(open('/tmp/bsp.out', errors='replace').read()[-1200:])
          kl = [p for p in logs if p.endswith('/logs/kernel.log')]
          for p in kl[:1]:
              t = open(p, errors='replace').read()
              i = t.find('Undefined symbols')
              parts.append('== kernel.log len=%d undef_at=%d' % (len(t), i))
              if i >= 0:
                  parts.append(t[i:i + 2200])
              parts.append('== kernel.tail')
              parts.append('\n'.join(t.splitlines()[-50:]))
          for f in glob.glob('out/shennong/*/*/shennong/tree/.cache/xnu-work/osfmk/conf/files'):
              for n, line in enumerate(open(f, errors='replace'), 1):
                  if 'vm_tests.c' in line:
                      parts.append('conf/files:%d %s' % (n, line.strip()))
          for f in glob.glob('out/shennong/*/*/shennong/tree/.cache/xnu-work/makedefs/MakeInc.kernel'):
              c = open(f, errors='replace').read()
              parts.append('MakeInc.kernel dyn=%d newlinker=%d' % (c.count('dynamic_lookup'), c.count('new_linker')))
          blob = '\n'.join(parts)
          print('report bytes', len(blob))
          for k in range(0, min(len(blob), 11000), 3800):
              print('::error::' + esc(blob[k:k + 3800]))
          PY
          cd "$GITHUB_WORKSPACE/device"
          mkdir -p ci-logs
          # Deterministic evidence for the second pass: the console is not always reachable, so
          # record whether it ran at all and how big its log was.
          cp -f /tmp/pass2.log ci-logs/pass2.log 2>/dev/null || true
          cp -f /tmp/second-rc.txt ci-logs/second-rc.txt 2>/dev/null || true
          { echo "second-rc: $(cat /tmp/second-rc.txt 2>/dev/null || echo missing)";
            echo "pass2.log: $(wc -c < /tmp/pass2.log 2>/dev/null || echo missing) bytes";
            ls -la /tmp/pass2.log /tmp/second-rc.txt 2>/dev/null || echo "neither file present"; } \
            > ci-logs/second-pass-evidence.txt || true
          cp -f ../unixnu/out/shennong/*/*/logs/*.log ci-logs/ 2>/dev/null || true
          cp -f /tmp/bsp.out ci-logs/ 2>/dev/null || true
          : > ci-logs/errors.txt
          for f in $(grep -rl -i -E 'error:|Error 1|fatal error' ../unixnu/out/shennong/*/*/shennong/tree/build --include='*.log' 2>/dev/null | head -12); do
            echo "### $f" >> ci-logs/errors.txt
            tail -25 "$f" >> ci-logs/errors.txt
          done
          if [ -s ci-logs/errors.txt ]; then
            tail -60 ci-logs/errors.txt | sed 's/^/::error::/'
          fi
          ls ci-logs | head -8
          git config user.name ci-bot
          git config user.email ci-bot@local
          git checkout -b "ci-logs-$GITHUB_RUN_ID" 2>/dev/null || git checkout "ci-logs-$GITHUB_RUN_ID"
          git add -f ci-logs
          git commit -m "ci: logs for run $GITHUB_RUN_ID" || echo nothing-to-commit
          git push --force origin "HEAD:refs/heads/ci-logs-$GITHUB_RUN_ID" || echo push-failed
      - name: Build DarwinBoot (the UEFI XNU loader)
        working-directory: unixnu
        run: |
          # uefi-sheng ships no UniXNULoaderProtocol implementation, so the loader that
          # RunXnu() needs has to come from drivers/DarwinBoot and travel in the payload
          # ([payload] loader = "payload" -> unixnu.toml [[driver]] Payloads/DarwinBoot.efi).
          set -eu
          EDK2="$GITHUB_WORKSPACE/uefi/Mu_Basecore"
          if [ ! -f "$EDK2/MdePkg/MdePkg.dec" ]; then
            echo "::error::Mu_Basecore/EDK2 is missing at $EDK2"
            exit 1
          fi
          if [ ! -x "$EDK2/BaseTools/Source/C/bin/VfrCompile" ] && [ ! -d "$EDK2/BaseTools/Source/C/bin" ]; then
            if ! make -C "$EDK2/BaseTools" -j"$(sysctl -n hw.ncpu)" > /tmp/basetools.out 2>&1; then
              tail -25 /tmp/basetools.out | sed 's/^/::error::/'
              echo "::error::EDK2 BaseTools build failed"
              exit 1
            fi
          fi
          # EDK2's build needs $WORKSPACE/Conf/tools_def.txt; edksetup.sh normally creates it
          # from the templates. Without this the build dies with:
          #   build.py... : error 000E: File/directory not found in workspace .../unixnu/Conf/tools_def.txt
          mkdir -p Conf
          for base in tools_def target build_rule; do
            if [ ! -f "Conf/$base.txt" ]; then
              cp "$EDK2/BaseTools/Conf/$base.template" "Conf/$base.txt"
            fi
          done
          export CONF_PATH="$PWD/Conf"
          # The firmware may already carry a gUniXNULoaderProtocolGuid instance from an older
          # UniXNU package. DarwinBootEntry() then returns EFI_ALREADY_STARTED at once, the
          # menu reports "start failed" and RunXnu() still finds no usable loader. Replace the
          # stale instance instead of refusing to start.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.c')
          text = path.read_text()
          old = ('  Status = gBS->LocateProtocol (&gUniXNULoaderProtocolGuid, NULL, &Existing);\n'
                 '  if (!EFI_ERROR (Status)) { return EFI_ALREADY_STARTED; }\n')
          new = ('  Status = gBS->LocateProtocol (&gUniXNULoaderProtocolGuid, NULL, &Existing);\n'
                 '  if (!EFI_ERROR (Status)) {\n'
                 '    EFI_HANDLE  *Handles;\n'
                 '    UINTN       HandleCount;\n'
                 '    UINTN       HandleIndex;\n'
                 '\n'
                 '    Handles     = NULL;\n'
                 '    HandleCount = 0;\n'
                 '    if (!EFI_ERROR (gBS->LocateHandleBuffer (ByProtocol, &gUniXNULoaderProtocolGuid, NULL, &HandleCount, &Handles))) {\n'
                 '      for (HandleIndex = 0; HandleIndex < HandleCount; HandleIndex++) {\n'
                 '        VOID  *Interface;\n'
                 '\n'
                 '        Interface = NULL;\n'
                 '        if (!EFI_ERROR (gBS->HandleProtocol (Handles[HandleIndex], &gUniXNULoaderProtocolGuid, &Interface))) {\n'
                 '          gBS->UninstallProtocolInterface (Handles[HandleIndex], &gUniXNULoaderProtocolGuid, Interface);\n'
                 '        }\n'
                 '      }\n'
                 '      gBS->FreePool (Handles);\n'
                 '    }\n'
                 '  }\n')
          if 'LocateHandleBuffer (ByProtocol, &gUniXNULoaderProtocolGuid' in text:
              print('darwinboot: stale protocol replacement already patched')
          elif old not in text:
              raise SystemExit('darwinboot: ALREADY_STARTED anchor not found')
          else:
              path.write_text(text.replace(old, new, 1))
              print('darwinboot: stale protocol replacement applied')
          PY
          export UNIXNU_EDK2="$EDK2"
          # CLANGPDB needs llvm-lib/llvm-objcopy next to clang; Xcode's toolchain has clang but
          # no llvm-lib, which failed the previous attempt with:
          #   /bin/sh: /Applications/Xcode_26.6.app/.../usr/bin/llvm-lib: No such file or directory
          # CLANGPDB wants clang, llvm-lib and lld-link in one directory. Homebrew ships the
          # first two in llvm/bin and the linker in the separate lld formula, which failed as:
          #   /bin/sh: /opt/homebrew/opt/llvm/bin/lld-link: No such file or directory
          LLVM_DIR="$(brew --prefix llvm)/bin"
          LLD_DIR="$(brew --prefix lld)/bin"
          if [ ! -x "$LLVM_DIR/llvm-lib" ]; then
            LLVM_DIR="$(dirname "$(xcrun -f clang 2>/dev/null || command -v clang)")"
          fi
          SHIM="$PWD/Conf/llvmbin"
          rm -rf "$SHIM"
          mkdir -p "$SHIM"
          for tool in "$LLVM_DIR"/*; do
            ln -s "$tool" "$SHIM/$(basename "$tool")"
          done
          for tool in lld-link ld.lld lld; do
            if [ -x "$LLD_DIR/$tool" ]; then ln -sf "$LLD_DIR/$tool" "$SHIM/$tool"; fi
          done
          if [ ! -x "$SHIM/lld-link" ]; then
            FOUND="$(command -v lld-link || true)"
            [ -n "$FOUND" ] && ln -sf "$FOUND" "$SHIM/lld-link"
          fi
          if [ ! -x "$SHIM/lld-link" ]; then
            echo "::error::no lld-link for the CLANGPDB toolchain"
            ls "$LLD_DIR" 2>/dev/null | head -10
            exit 1
          fi
          export CLANG_BIN="$SHIM/"
          echo "darwinboot toolchain: $LLVM_DIR + $(readlink -f "$SHIM/lld-link")"
          export TARGET=RELEASE
          if ! bash scripts/build-darwinboot.sh > /tmp/darwinboot.out 2>&1; then
            tail -40 /tmp/darwinboot.out | sed 's/^/::error::/'
            echo "::error::DarwinBoot build failed"
            exit 1
          fi
          EFI=$(find Build -name DarwinBoot.efi -type f 2>/dev/null | head -1)
          if [ -z "$EFI" ]; then
            echo "::error::DarwinBoot.efi was not produced"
            find Build -maxdepth 4 -name '*.efi' 2>/dev/null | head -5
            exit 1
          fi
          cp "$EFI" /tmp/DarwinBoot.efi
          echo "darwinboot: $EFI"
          ls -l /tmp/DarwinBoot.efi
          shasum -a 256 /tmp/DarwinBoot.efi
      - name: Build ShengUfs archive for probing
        if: always()
        working-directory: unixnu
        run: |
          set +e
          TREE=$(ls -d out/shennong/*/shennong/tree 2>/dev/null | head -1)
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          [ -n "$TREE" ] || { echo "::error::no tree"; exit 0; }
          python3 "$TREE/scripts/build-arm-driver.py" ShengUfs > /tmp/shengufs.out 2>&1
          RC=$?
          AR=$(ls -t "$TREE"/build/sheng-ufs/*.a 2>/dev/null | head -1)
          MEMBERS=$(ar t "$AR" 2>/dev/null | tr '\n' ' ')
          UNDEF=$(nm -u "$AR" 2>/dev/null | grep -c ' U ')
          STORAGE=$(nm -u "$AR" 2>/dev/null | grep -c 'IOBlockStorageDevice')
          NMRAW=$(nm -u "$AR" 2>&1 | head -4 | tr '\n' '|')
          SIZE=$(wc -c < "$AR" 2>/dev/null || echo 0)
          echo "::error::ARCH rc=$RC size=$SIZE ar=$AR members=[$MEMBERS] undef=$UNDEF storage=$STORAGE nmraw=[$NMRAW]"
          tail -4 /tmp/shengufs.out | tr '\n' '|' | sed 's/^/::error::arndrv: /'
          exit 0
      - name: Build prelink
        if: always()
        working-directory: unixnu
        run: |
          TREE=$(ls -d out/shennong/*/shennong/tree 2>/dev/null | head -1)
          [ -n "$TREE" ] || { echo "::error::no tree for prelink"; exit 0; }
          ./unixnu build prelink > /tmp/prelink2.out 2>&1
          RC=$?
          echo "prelink rc=$RC"
          tail -25 /tmp/prelink2.out | sed 's/^/::error::/'
          ls -la out/shennong/*/shennong/kernel/ 2>&1 | head -8 | sed 's/^/::error::/'
          ls -la "$TREE"/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf 2>&1 | sed 's/^/::error::/'
          exit 0
      - name: Measure the storage bindings
        if: always()
        working-directory: unixnu
        run: |
          set -u
          # ShengUfs subclasses IOBlockStorageDevice, which ships inside the prelinked
          # IOStorageFamily kext rather than in XNU. The driver's inherited slots are
          # therefore bound as absolute symbols measured out of the original kernelcache
          # (scripts/scan-prelink-storage.py), not linked. That measurement needs the
          # compile record the kernel build just wrote, so it belongs here rather than in
          # the device repository.
          TREE_REL=$(ls -d out/shennong/*/shennong/tree 2>/dev/null | head -1)
          [ -n "$TREE_REL" ] || { echo "::error::no tree for the binding scan"; exit 0; }
          # The scan feeds this path to clang, which does not run in this directory,
          # so it has to be absolute.
          TREE=$(cd "$TREE_REL" && pwd)
          # The scan measures the board's own kernelcache, so the IPSW and its device class
          # come from board.toml [ipsw]; the iPadOS 17.7.11 pins used to be hard-coded here
          # and measured the wrong kernel once the OS profile moved to iPhone17,1 27.0.1.
          read -r IPSW_URL DEVICE_CLASS <<<"$(python3 -c "
import tomllib
b = tomllib.load(open('$GITHUB_WORKSPACE/device/board.toml', 'rb'))['ipsw']
print(b['url'], b['device_class'])")"
          IP="out/ipsw/$(basename "$IPSW_URL")"
          echo "scan IPSW: $IP (device class $DEVICE_CLASS)"
          mkdir -p out/ipsw
          if [ ! -f "$IP" ]; then
            curl -sL --max-time 3600 -o "$IP" "$IPSW_URL" \
              || { echo "::warning::IPSW download failed; keeping the previous bindings"; IP=""; }
          fi
          if [ -n "$IP" ]; then ls -l "$IP"; fi
          python3 -m pip install --quiet pyliblzfse || echo "::warning::pyliblzfse install failed"
          # The scan compiles Apple's published IOBlockStorageDevice.cpp with the flags
          # the kernel build recorded, so the reference sources must be in the tree.
          REF="$TREE/refer/IOStorageFamily"
          ./unixnu fetch IOStorageFamily > /tmp/refetch.out 2>&1 || echo "::warning::IOStorageFamily fetch failed"
          ./unixnu tree -D "$UNIXNU_DEVICE" > /tmp/retree.out 2>&1 || echo "::warning::tree reassembly failed"
          if [ ! -f "$REF/IOBlockStorageDevice.cpp" ]; then
            echo "::warning::reference sources missing after fetch; cloning them directly"
            rm -rf "$REF"
            mkdir -p "$(dirname "$REF")"
            git clone --depth 1 https://github.com/apple-oss-distributions/IOStorageFamily.git "$REF" \
              || echo "::warning::IOStorageFamily clone failed"
          fi
          ls "$REF" 2>/dev/null | head -3 | sed 's/^/::warning::refer: /'
          ls -l "$REF/IOBlockStorageDevice.cpp" 2>&1 | sed 's/^/::warning::refer file: /'
          # The runner shell is bash -e, so a failing scan would abort before its own
          # diagnostics are printed. Swallow the failure and always dump the output.
          if [ -n "$IP" ]; then
            python3 "$GITHUB_WORKSPACE/device/scripts/scan-prelink-storage.py" \
              --ipsw "$IP" --device-class "$DEVICE_CLASS" --tree "$TREE" \
              --output "$GITHUB_WORKSPACE/device/scripts/prelink-storage-bindings.json" \
              > /tmp/sstorage.out 2>&1 || echo "scan failed rc=$?"
          else
            echo "::warning::no IPSW; the storage bindings are unchanged this run"
          fi
          # The scan measures the original kernelcache, where the kexts sit at their
          # original addresses. The prelink slides every component by board.toml
          # [kernel.prelink] slide, so shift what was just measured, or the bound
          # constructor lands on zeros and the CPU takes an undefined-instruction panic.
          python3 "$GITHUB_WORKSPACE/device/scripts/apply-prelink-slide.py" \
            --bindings "$GITHUB_WORKSPACE/device/scripts/prelink-storage-bindings.json" \
            --board "$GITHUB_WORKSPACE/device/board.toml" \
            | sed 's/^/::warning::slide: /'
          tail -30 /tmp/sstorage.out | sed 's/^/::error::storage scan: /'
          tail -20 /tmp/sstorage.out | sed 's/^/::error::storage scan: /'
          if [ -f "$GITHUB_WORKSPACE/device/scripts/prelink-storage-bindings.json" ]; then
            python3 - "$GITHUB_WORKSPACE/device/scripts/prelink-storage-bindings.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          print('bindings', len(data), 'bytes', hashlib.sha256(data).hexdigest())
          doc = json.loads(data)
          print('keys', sorted(doc)[:8])
          PY
          fi
          exit 0
      - name: Upload the storage bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-bindings
          if-no-files-found: warn
          path: device/scripts/prelink-storage-bindings.json
      - name: Probe storage bindings
        if: always()
        working-directory: unixnu
        run: |
          TREE=$(ls -d out/shennong/*/shennong/tree 2>/dev/null | head -1)
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          M=$(ls -t out/shennong/*/shennong/kernel/kernel.macho 2>/dev/null | head -1)
          [ -n "$M" ] || M=$(ls -t out/shennong/*/payload/stage/EFI/UniXNU/Payloads/kernel.macho 2>/dev/null | head -1)
          A=$(ls -t "$TREE"/build/sheng-ufs/libShengUfs.a 2>/dev/null | head -1)
          P=$(dirname "$M")/kernel.json
          [ -f "$P" ] || P="$M.json"
          echo "tree=$TREE macho=$M plan=$P archive=$A"
          [ -n "$TREE" ] || { echo "::error::probe skip: no tree"; exit 0; }
          [ -f "$M" ] || { echo "::error::probe skip: no kernel.macho"; exit 0; }
          [ -f "$A" ] || echo "::error::no ShengUfs archive; probe uses the known 11-import list"
          if ! python3 "$TREE/scripts/shennong-storage-probe.py" --macho "$M" --plan "$P" --archive "$A" --out /tmp/probe.json > /tmp/probe.out 2>&1; then
            echo "::error::probe crashed"
            tail -8 /tmp/probe.out | sed 's/^/::error::/'
            exit 0
          fi
          grep '^PROBE ' /tmp/probe.out | head -1 | sed 's/^/::error::/'
          grep '^MISSING ' /tmp/probe.out | head -8 | sed 's/^/::error::/'
          cp -f /tmp/probe.json /tmp/probe-keep.json 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/device"
          cp -f /tmp/probe-keep.json ci-logs-probe.json 2>/dev/null || true
          git config user.name ci-bot
          git config user.email ci-bot@local
          git checkout -q -B "ci-probe-$GITHUB_RUN_ID" 2>/dev/null || true
          git add -f ci-logs-probe.json 2>/dev/null || true
          git commit -q -m "probe run $GITHUB_RUN_ID" 2>/dev/null || echo nothing-to-commit
          git push --force origin "HEAD:refs/heads/ci-probe-$GITHUB_RUN_ID" 2>/dev/null || echo push-failed
          exit 0
      - name: Build the trust bundle
        working-directory: unixnu
        run: |
          # The loader accepts the trust-cache bundle format (a count/offset header followed
          # by the raw modules), not an IPSW IM4P: packing the IM4P makes the firmware refuse
          # the payload with "Compromised Data". scripts/build-original-system-trust.py
          # verifies both modules against their pinned digests and writes the bundle.
          # Same IPSW as board.toml [ipsw]: the static trust cache that lets AMFI accept
          # launchd has to come from the same build as the kernel being packaged.
          read -r IPSW_URL DEVICE_CLASS <<<"$(python3 -c "
import tomllib
b = tomllib.load(open('$GITHUB_WORKSPACE/device/board.toml', 'rb'))['ipsw']
print(b['url'], b['device_class'])")"
          IPSW_NAME=$(basename "$IPSW_URL")
          IP="out/ipsw/$IPSW_NAME"
          [ -f "$IP" ] || curl -sL --max-time 3600 -o "$IP" "$IPSW_URL" \
            || { echo "::error::IPSW download failed for the trust bundle"; exit 1; }
          mkdir -p refer .cache/firmware/target-volumes
          ln -f "$(cd "$(dirname "$IP")" && pwd)/$IPSW_NAME" "refer/$IPSW_NAME" 2>/dev/null \
            || cp "$IP" "refer/$IPSW_NAME"
          IPSW_NAME="$IPSW_NAME" DEVICE_CLASS="$DEVICE_CLASS" python3 - <<'PY'
          import plistlib, zipfile
          from pathlib import Path

          def der(data, at):
              tag, size = data[at:at + 2]
              at += 2
              if size & 128:
                  count = size & 127
                  size = int.from_bytes(data[at:at + count], 'big')
                  at += count
              return tag, data[at:at + size], at + size

          import os
          name, devclass = os.environ['IPSW_NAME'], os.environ['DEVICE_CLASS']
          with zipfile.ZipFile('refer/' + name) as archive:
              manifest = plistlib.loads(archive.read('BuildManifest.plist'))
              identity = [i for i in manifest['BuildIdentities']
                          if i['Info']['DeviceClass'] == devclass][0]
              raw = archive.read(identity['Manifest']['StaticTrustCache']['Info']['Path'])
          tag, sequence, end = der(raw, 0)
          fields, cursor = [], 0
          while cursor < len(sequence):
              kind, data, cursor = der(sequence, cursor)
              fields.append((kind, data))
          if fields[0][1] != b'IM4P':
              raise SystemExit('static trust cache is not an IM4P')
          Path('.cache/firmware/target-volumes/static-trustcache.bin').write_bytes(fields[3][1])
          print('static module:', len(fields[3][1]), 'bytes')
          PY
          if ! python3 scripts/build-original-system-trust.py > /tmp/trust-bundle.out 2>&1; then
            tail -20 /tmp/trust-bundle.out | sed 's/^/::error::/'
            exit 1
          fi
          tail -2 /tmp/trust-bundle.out
          ls -l build/original-static-system-trust/*.bundle | sed 's/^/trust bundle: /'
      - name: Build payload
        working-directory: unixnu
        run: |
          # The static trust cache of this IPSW is what lets AMFI accept launchd; the
          # payload step packs it and the ADT gains its TrustCache memory-map entry.
          TC=$(ls -t build/original-static-system-trust/*.bundle out/ipsw/*/*.trustcache 2>/dev/null | head -1)
          echo "trust cache: ${TC:-none}"
          TC_ARG=""; [ -n "$TC" ] && TC_ARG="--trust-cache $(cd "$(dirname "$TC")" && pwd)/$(basename "$TC")"
          # kernel_symbols() parses llvm-nm output assuming every line with three fields
          # starts with a hex address. A fileset kernel makes nm emit non-symbol lines
          # (e.g. "Symbols:"), which crashed the payload probe with
          # "invalid literal for int() with base 16: 'Symbols'". Skip what does not parse
          # and never fail on nm's exit status; print what nm said when the table is empty.
          python3 - <<'PY'
          import glob
          from pathlib import Path
          OLD = (
              "    for line in subprocess.run([nm, '-n', kernel], capture_output=True, text=True, check=True).stdout.splitlines():\n"
              "        parts = line.split()\n"
              "        if len(parts) == 3:\n"
              "            table.setdefault(int(parts[0], 16), parts[2])\n"
              "    return table\n")
          NEW = (
              "    result = subprocess.run([nm, '-n', kernel], capture_output=True, text=True)\n"
              "    for line in result.stdout.splitlines():\n"
              "        parts = line.split()\n"
              "        if len(parts) != 3:\n"
              "            continue\n"
              "        try:\n"
              "            address = int(parts[0], 16)\n"
              "        except ValueError:\n"
              "            continue\n"
              "        table.setdefault(address, parts[2])\n"
              "    if not table:\n"
              "        print(f'kernel_symbols: nm rc={result.returncode} out={result.stdout[:300]!r} err={result.stderr[:300]!r}')\n"
              "    return table\n")
          targets = ['scripts/patch-xnu-entry-probe.py']
          targets += glob.glob('out/shennong/*/*/shennong/tree/scripts/patch-xnu-entry-probe.py')
          patched = 0
          for name in targets:
              path = Path(name)
              if not path.is_file():
                  continue
              source = path.read_text()
              if NEW in source:
                  print('probe symbols: already tolerant in', path)
                  patched += 1
              elif OLD in source:
                  path.write_text(source.replace(OLD, NEW, 1))
                  print('probe symbols: patched', path)
                  patched += 1
              else:
                  print('::warning::probe symbols: pattern missing in', path)
          if not patched:
              raise SystemExit('probe symbols: no script patched')
          PY
          # PANIC_CAVE_END is a constant of the Apple kernelcache layout; a kernel linked at
          # another address keeps zero padding past it and the panic screen is rejected for a
          # few dozen bytes. Extend the cave end through the real zero run (never over data)
          # and only as far as the assembled code needs.
          python3 - <<'PY'
          import glob
          from pathlib import Path
          GLOBAL_OLD = "def main():\n"
          GLOBAL_NEW = "def main():\n    global PANIC_CAVE_END\n"
          FIT_OLD = (
              "        if load + len(code) > PANIC_CAVE_END:\n"
              "            raise SystemExit(f'panic screen is {len(code):#x} bytes at {load:#x}, the padding ends at {PANIC_CAVE_END:#x}')\n")
          FIT_NEW = (
              "        if load + len(code) > PANIC_CAVE_END:\n"
              "            extended = PANIC_CAVE_END\n"
              "            while extended < load + len(code) + 0x10:\n"
              "                try:\n"
              "                    if data[file_offset(extended)]:\n"
              "                        break\n"
              "                except SystemExit:\n"
              "                    break\n"
              "                extended += 0x10\n"
              "            if load + len(code) > extended:\n"
              "                raise SystemExit(f'panic screen is {len(code):#x} bytes at {load:#x}, the padding ends at {extended:#x}')\n"
              "            PANIC_CAVE_END = extended\n")
          targets = ['scripts/patch-xnu-entry-probe.py']
          targets += glob.glob('out/shennong/*/*/shennong/tree/scripts/patch-xnu-entry-probe.py')
          done = 0
          for name in targets:
              path = Path(name)
              if not path.is_file():
                  continue
              source = path.read_text()
              if FIT_NEW in source:
                  print('panic cave: already extended in', path)
                  done += 1
                  continue
              if FIT_OLD not in source:
                  print('::warning::panic cave: fit check missing in', path)
                  continue
              source = source.replace(FIT_OLD, FIT_NEW, 1)
              if 'global PANIC_CAVE_END' not in source:
                  source = source.replace(GLOBAL_OLD, GLOBAL_NEW, 1)
              path.write_text(source)
              print('panic cave: extended in', path)
              done += 1
          if not done:
              raise SystemExit('panic cave: no script patched')
          PY
          # The reference panic cave (right after the probe caves) is sized for the Apple
          # kernelcache layout; a kernel linked elsewhere leaves too little there (0xa30 for a
          # 0xa47-byte screen) while large zero runs remain in __TEXT_EXEC. Put the screen in the
          # largest zero run of an executable segment instead of a fixed offset.
          python3 - <<'PY'
          import glob
          from pathlib import Path
          HELPERS = (
              "def _exec_segments(data):\n"
              "    magic, _, _, _, ncmds = struct.unpack_from('<IiiII', data, 0)\n"
              "    table, offset = [], 32\n"
              "    for _ in range(ncmds):\n"
              "        cmd, size = struct.unpack_from('<II', data, offset)\n"
              "        if cmd == 0x19:\n"
              "            name, va, vsize, foff, fsize, maxprot, initprot = struct.unpack_from('<16s4Q2I', data, offset + 8)\n"
              "            if fsize and initprot & 4:\n"
              "                table.append((va, vsize, foff, fsize))\n"
              "        offset += size\n"
              "    return table\n"
              "\n"
              "\n"
              "def _free_panic_cave(data, need=0x1000):\n"
              "    best = None\n"
              "    needle = bytes(0x100)\n"
              "    for va, vsize, foff, fsize in _exec_segments(data):\n"
              "        span = data[foff:foff + min(vsize, fsize)]\n"
              "        at = 0\n"
              "        while True:\n"
              "            hit = span.find(needle, at)\n"
              "            if hit < 0:\n"
              "                break\n"
              "            run = 0\n"
              "            while hit + run < len(span) and span[hit + run] == 0:\n"
              "                run += 1\n"
              "            if run >= need and (best is None or run > best[2]):\n"
              "                best = (va + hit, va + hit + run, run)\n"
              "                break\n"
              "            at = hit + 1\n"
              "    if best is None:\n"
              "        return None, None\n"
              "    return best[0], best[1]\n"
              "\n"
              "\n")
          CAVE_OLD = (
              "        PANIC_CAVE = max(CAVES[stage] for _, stage, _ in sites) + CAVE_SIZE\n"
              "        if word(PANIC_VA) in (0, 0xFFFFFFFF) or any(data[file_offset(PANIC_CAVE):file_offset(PANIC_CAVE_END)]):\n"
              "            raise SystemExit('panic() or the panic screen padding is not as expected')\n")
          CAVE_NEW = (
              "        PANIC_CAVE, PANIC_CAVE_END = _free_panic_cave(data)\n"
              "        if PANIC_CAVE is None or word(PANIC_VA) in (0, 0xFFFFFFFF):\n"
              "            raise SystemExit('panic() or the panic screen padding is not as expected')\n")
          targets = ['scripts/patch-xnu-entry-probe.py']
          targets += glob.glob('out/shennong/*/*/shennong/tree/scripts/patch-xnu-entry-probe.py')
          done = 0
          for name in targets:
              path = Path(name)
              if not path.is_file():
                  continue
              source = path.read_text()
              if '_free_panic_cave' in source:
                  print('panic cave scan: already present in', path)
                  done += 1
                  continue
              if CAVE_OLD not in source:
                  print('::warning::panic cave scan: anchor missing in', path)
                  continue
              source = source.replace(CAVE_OLD, CAVE_NEW, 1)
              source = source.replace('def main():\n', HELPERS + 'def main():\n', 1)
              path.write_text(source)
              print('panic cave scan: applied to', path)
              done += 1
          if not done:
              raise SystemExit('panic cave scan: no script patched')
          PY
          if ! ./unixnu build payload --uefi "$GITHUB_WORKSPACE/uefi" $TC_ARG > /tmp/payload.out 2>&1; then
            head -20 /tmp/payload.out | sed 's/^/::error::/'
            grep -n -A25 -E 'Traceback|Error:|error:' /tmp/payload.out | head -70 | sed 's/^/::error::/'
            echo "::error::build payload failed"
            for f in $(ls -t out/shennong/*/*/logs/*.log 2>/dev/null | head -4); do
              echo "--- $f ($(wc -c < "$f") bytes)"
              tail -14 "$f" | sed 's/^/::error::/'
            done
            for f in out/shennong/*/*/kernel/kernel.macho out/shennong/*/*/payload/payload.img; do
              [ -f "$f" ] && echo "found $(basename "$f") $(wc -c < "$f") bytes"
            done
            exit 1
          fi
          # The menu loads the XNU loader from the payload volume: without this file
          # RunXnu() has no gUniXNULoaderProtocolGuid and returns EFI_UNSUPPORTED.
          if [ ! -f /tmp/DarwinBoot.efi ]; then
            echo "::error::no DarwinBoot.efi to inject; the menu would report EFI_UNSUPPORTED"
            exit 1
          fi
          PAYLOAD=$(ls -t out/shennong/*/shennong/payload/payload.img out/shennong/payload/payload.img 2>/dev/null | head -1)
          if [ -z "$PAYLOAD" ]; then
            echo "::error::payload.img is missing after a successful payload build"
            exit 1
          fi
          mcopy -o -i "$PAYLOAD" /tmp/DarwinBoot.efi ::/EFI/UniXNU/Payloads/DarwinBoot.efi
          mdir -i "$PAYLOAD" ::/EFI/UniXNU/Payloads | grep -i darwinboot | sed 's/^/payload driver: /'
          echo "payload: DarwinBoot.efi injected into $PAYLOAD ($(wc -c < "$PAYLOAD") bytes)"
      - name: Replace the schema-2 ADT with the board ADT
        working-directory: unixnu
        run: |
          set -eu
          # A format-2 board makes the upstream payload builder derive the ADT from the
          # IPSW device tree (scripts/unixnu/payload.py: ctx.schema_version == 2 ->
          # devicetree.generate(compile_hardware(ctx))). That tree is an iPad one:
          # /cpus carries cpu0..cpu7 and no Apple validation properties, so
          # AppleARMCPU matches it and panics at AppleARMCPU.cpp:111. A board ADT with a
          # single cpu0 node is the shape that boots (Mu-shennong-6-pmgr2, 2026-10-28).
          PAY=""
          for candidate in out/shennong/*/shennong/payload/payload.img out/shennong/payload/payload.img; do
            if [ -f "$candidate" ]; then PAY="$candidate"; break; fi
          done
          if [ -z "$PAY" ]; then
            echo "::error::no payload.img to carry the board ADT"
            exit 1
          fi
          ADT=/tmp/board-adt.bin
          ROOT_UUID=$(python3 -c "import tomllib;print(tomllib.load(open('$GITHUB_WORKSPACE/device/board.toml','rb'))['payload']['adt'].get('root_match_volume_uuid',''))")
          echo "adt root-match volume uuid: ${ROOT_UUID:-none}"
          TC=$(ls -t build/original-static-system-trust/*.bundle out/ipsw/*/*.trustcache 2>/dev/null | head -1)
          echo "adt trust cache: ${TC:-none}"
          # DarwinBoot refuses to boot when kernel.macho.vroot exists but the ADT has no
          # RootPolicies slot (DarwinBoot.c: PolicyOffset == MAX_UINTN -> EFI_COMPROMISED_DATA).
          POLICIES_ARG=""
          if mtype -i "$PAY" ::/EFI/UniXNU/Payloads/kernel.macho.vroot > /dev/null 2>&1; then
            POLICIES_ARG="--root-policies"
            echo "adt: payload carries kernel.macho.vroot; reserving RootPolicies"
          fi
          python3 "$GITHUB_WORKSPACE/device/scripts/make-shennong-adt.py" \
            --output "$ADT" --dram-size 0x10000000 --owned-memory-size 0x10000000 \
            --cpu-regs 0 --psci-method smc \
            ${ROOT_UUID:+--root-match-volume-uuid "$ROOT_UUID"} \
            ${TC:+--trust-cache} $POLICIES_ARG
          rm -f /tmp/adt-before.bin /tmp/adt-after.bin
          mcopy -o -i "$PAY" ::/EFI/UniXNU/Payloads/kernel.macho.adt /tmp/adt-before.bin || true
          mcopy -o -i "$PAY" "$ADT" ::/EFI/UniXNU/Payloads/kernel.macho.adt
          mcopy -o -i "$PAY" ::/EFI/UniXNU/Payloads/kernel.macho.adt /tmp/adt-after.bin
          python3 - "$ADT" /tmp/adt-before.bin /tmp/adt-after.bin "$PAY" <<'PY'
          import hashlib, sys
          from pathlib import Path
          def sha(p):
              d = Path(p).read_bytes()
              return hashlib.sha256(d).hexdigest(), len(d)
          want = sha(sys.argv[1])
          before = sha(sys.argv[2]) if Path(sys.argv[2]).is_file() else ('absent', 0)
          after = sha(sys.argv[3])
          print(f'board adt {want[1]} bytes {want[0]}')
          print(f'adt before {before[1]} bytes {before[0]}')
          print(f'adt after  {after[1]} bytes {after[0]}')
          if after != want:
              raise SystemExit('the payload ADT does not match the board ADT')
          payload = sha(sys.argv[4])
          print(f'payload   {payload[1]} bytes {payload[0]}')
          PY
      - name: Patch AppleARMCPU IONameMatch (cpu -> xpu)
        if: always()
        working-directory: unixnu
        run: |
          set -u
          PAY=$(ls -t out/shennong/*/shennong/payload/payload.img out/shennong/payload/payload.img 2>/dev/null | head -1)
          if [ -z "$PAY" ] || [ ! -f "$PAY" ]; then
            # Build payload already failed the job; do not report a second root cause.
            echo "::warning::no payload.img to patch"
            exit 0
          fi
          OUT="${PAY%.img}-xpu.img"
          echo "payload=$PAY bytes=$(wc -c < "$PAY") sha256=$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$PAY")"
          if ! python3 "$GITHUB_WORKSPACE/device/scripts/patch-applearmcpu-ioname.py" \
                 --payload "$PAY" --out "$OUT" --report "${OUT%.img}.json" > /tmp/ioname.out 2>&1; then
            tail -25 /tmp/ioname.out | sed 's/^/::error::/'
            echo "::error::AppleARMCPU IONameMatch patch failed"
            exit 1
          fi
          (grep -E '^(patched|result):' /tmp/ioname.out || tail -6 /tmp/ioname.out) \
            | sed 's/^/::error::ioname /'
          if ! python3 "$GITHUB_WORKSPACE/device/scripts/patch-applearmcpu-ioname.py" \
                 --payload "$OUT" --check > /tmp/ioname2.out 2>&1; then
            tail -10 /tmp/ioname2.out | sed 's/^/::error::/'
            echo "::error::patched payload fails the read-only re-check"
            exit 1
          fi
          grep -o '"status": "[a-z-]*"' /tmp/ioname2.out | head -1 | sed 's/^/::error::idempotence /'
          exit 0
      - name: Probe kext symbol table
        if: always()
        working-directory: unixnu
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          TREE=$(ls -d out/shennong/*/shennong/tree 2>/dev/null | head -1)
          KC=$(ls -t out/ipsw/*/kernelcache.decompressed out/shennong/ipsw/*/kernelcache.decompressed 2>/dev/null | head -1)
          A=$(ls -t "$TREE"/build/sheng-ufs/libShengUfs.a 2>/dev/null | head -1)
          echo "kernelcache=$KC archive=$A"
          ls -d out/ipsw/* 2>/dev/null | head -3
          [ -n "$TREE" ] || { echo "::error::kext probe skip: no tree"; exit 0; }
          [ -f "$KC" ] || { echo "::error::kext probe skip: no kernelcache.decompressed"; exit 0; }
          [ -f "$A" ] || { echo "::error::kext probe skip: no libShengUfs.a"; exit 0; }
          if ! python3 "$TREE/scripts/shennong-kext-exports-probe.py" "$KC" "$A" > /tmp/kextprobe.out 2>&1; then
            echo "::error::kext probe crashed"
            tail -15 /tmp/kextprobe.out | sed 's/^/::error::/'
            exit 0
          fi
          tail -20 /tmp/kextprobe.out | sed 's/^/::error::/'
      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shennong-kernel-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            unixnu/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837*
            unixnu/out/shennong/*/shennong/tree/build/xnu/ios-obj/*/mach.development.bcm2837*
            unixnu/out/shennong/*/shennong/build/xnu/ios-obj/*/mach.development.bcm2837*
            unixnu/out/shennong/kernel/kernel.macho*
            unixnu/out/shennong/payload/payload.img
            unixnu/out/shennong/*/shennong/payload/payload.img
            unixnu/out/shennong/*/shennong/payload/payload-xpu.img
            unixnu/out/shennong/*/shennong/payload/payload-xpu.json
            unixnu/out/shennong/*/shennong/payload/payload.json
            unixnu/out/shennong/*/shennong/kernel/kernel.macho*
            unixnu/out/shennong/*/shennong/kernel/kernel*.json
            unixnu/out/shennong/payload/payload.json
            unixnu/out/shennong/logs/*.log
            unixnu/out/shennong/*/*/logs/*.log
      - name: Publish failure logs
        if: failure()
        run: |
          # The build agent cannot read the Actions console, and the check-run annotation limit
          # truncates the payload traceback, so keep every captured *.out and the tree logs on a
          # branch. Files above the API content limit are cut to head+tail around the failure.
          cd "$GITHUB_WORKSPACE/device"
          mkdir -p ci-logs/tmp
          for f in /tmp/*.out /tmp/pass2.log /tmp/second-rc.txt; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            if [ "$(wc -c < "$f")" -gt 900000 ]; then
              { head -c 300000 "$f"; printf '\n=== (truncated; last 300000 bytes follow) ===\n'; tail -c 300000 "$f"; } > "ci-logs/tmp/$b"
            else
              cp "$f" "ci-logs/tmp/$b"
            fi
          done
          cp -f ../unixnu/out/shennong/*/*/logs/*.log ci-logs/ 2>/dev/null || true
          cp -f ../unixnu/out/shennong/*/*/kernel/*.json ci-logs/ 2>/dev/null || true
          cp -f ../unixnu/out/shennong/*/*/payload/*.json ci-logs/ 2>/dev/null || true
          ls -l ci-logs ci-logs/tmp | head -24
          git config user.name ci-bot
          git config user.email ci-bot@local
          git checkout -b "ci-logs-$GITHUB_RUN_ID" 2>/dev/null || git checkout "ci-logs-$GITHUB_RUN_ID"
          git add -f ci-logs
          git commit -m "ci: failure logs for run $GITHUB_RUN_ID" || echo nothing-to-commit
          git push --force origin "HEAD:refs/heads/ci-logs-$GITHUB_RUN_ID" || echo push-failed
  logs:
    needs: kernel
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo "kernel job finished"

