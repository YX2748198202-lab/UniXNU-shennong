name: shennong kernel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu
          submodules: recursive
      - name: Check out uefi-sheng (panic screen font)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: sheng
          path: uefi
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then brew install unifdef; echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"; fi
      - name: Fetch device modules
        working-directory: unixnu
        run: ./unixnu fetch -D "$UNIXNU_DEVICE"
      - name: Defconfig
        working-directory: unixnu
        run: ./unixnu defconfig shennong_defconfig -D "$UNIXNU_DEVICE"
      - name: Build kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          SRC_SCRIPT=scripts/build-xnu-4k-baseline.sh
          INJECT='LDFLAGS_KERNEL_DEVELOPMENT="-Wl,-undefined,dynamic_lookup" LDFLAGS_KERNEL_ONLY="-Wl,-undefined,dynamic_lookup" VERBOSE=YES'
          if [ -f "$SRC_SCRIPT" ] && ! grep -q 'VERBOSE=YES' "$SRC_SCRIPT"; then
            sed -i '' "s|make -C .cache/xnu-work|make -C .cache/xnu-work $INJECT|" "$SRC_SCRIPT" || true
          fi
          echo "=== INJECT SOURCE ==="
          echo "count=$(grep -c 'VERBOSE=YES' "$SRC_SCRIPT" || true)"
          grep -n 'VERBOSE=YES' "$SRC_SCRIPT" | head -2 | cut -c1-180
          echo "=== INJECT SOURCE END ==="
          # symbols helper must tolerate objects the failed link pass removed
          SYMFILE=scripts/xnu_symbols.py
          if [ -f "$SYMFILE" ] && ! grep -q 'if Path(path).is_file()' "$SYMFILE"; then
            sed -i '' 's|paths = \[str(path) for path in paths\]|paths = [str(path) for path in paths if Path(path).is_file()]|' "$SYMFILE" || true
          fi
          echo "symbols-helper patched: $(grep -c 'if Path(path).is_file()' "$SYMFILE" || true)"
          ./unixnu build kernel || echo "first pass failed as expected"
          TREE=$(ls -d out/shennong/*/shennong/tree 2>/dev/null | head -1)
          echo "tree=$TREE"
          test -d "$TREE" || exit 1
          echo "=== INJECT TREE COPY ==="
          if [ -f "$TREE/scripts/build-xnu-4k-baseline.sh" ] && ! grep -q 'VERBOSE=YES' "$TREE/scripts/build-xnu-4k-baseline.sh"; then
            sed -i '' "s|make -C .cache/xnu-work|make -C .cache/xnu-work $INJECT|" "$TREE/scripts/build-xnu-4k-baseline.sh" || true
          fi
          echo "tree count=$(grep -c 'VERBOSE=YES' "$TREE/scripts/build-xnu-4k-baseline.sh" || true)"
          echo "=== INJECT TREE END ==="
          mkdir -p "$TREE/drivers"
          if [ ! -f "$TREE/drivers/ShengUfs/NativeUfs.cpp" ]; then
            rm -rf "$TREE/drivers/ShengUfs"
            git clone --depth 1 https://github.com/UniXNU/NativeUfs.git "$TREE/drivers/ShengUfs" || true
          fi
          git clone --depth 1 https://github.com/UniXNU/VerifiedRoot.git /tmp/VerifiedRoot || true
          cp /tmp/VerifiedRoot/verified_root.h /tmp/VerifiedRoot/VerifiedBlockPolicy.h "$TREE/drivers/ShengUfs/". 2>/dev/null || true
          ls "$TREE/drivers/ShengUfs/" | head -20
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          python3 "$TREE/scripts/build-sheng-platform-power.py"
          python3 "$TREE/scripts/build-mockfs-fixture.py" || true
          if ! grep -q ufs_stub_sha256 "$TREE/drivers/ShengUfs/NativeUfs.cpp" 2>/dev/null; then
            cat >> "$TREE/drivers/ShengUfs/NativeUfs.cpp" <<'STUBEOF'
          extern "C" {
          static int ufs_stub_sha256(const void *a, size_t b, uint8_t c[32]) { (void)a;(void)b;(void)c; return 1; }
          static int ufs_stub_rsa(const uint8_t a[VR_KEY_BYTES], const uint8_t b[32], const uint8_t c[VR_SIGNATURE_BYTES]) { (void)a;(void)b;(void)c; return 1; }
          const uint8_t verified_root_key[VR_KEY_BYTES] = {0};
          const NativeVerifiedBlockPolicy verified_root_policies[1] = {};
          const uint64_t verified_root_policy_count = 0;
          const struct vr_crypto vr_xnu_crypto = { ufs_stub_sha256, ufs_stub_rsa };
          int vr_open(const uint8_t *a, size_t b, const uint8_t c[VR_KEY_BYTES], uint64_t d, const struct vr_crypto *e, struct vr_view *f) { (void)a;(void)b;(void)c;(void)d;(void)e;(void)f; return 1; }
          int vr_verify_block(const struct vr_view *a, uint64_t b, const void *c, size_t d, const struct vr_crypto *e) { (void)a;(void)b;(void)c;(void)d;(void)e; return 1; }
          void boot_progress_poll(void) {}
          }
          STUBEOF
          fi
          tail -3 "$TREE/drivers/ShengUfs/NativeUfs.cpp"
          SRC=unixnu/drivers/ShengUfs/NativeUfs.cpp
          if [ -f "$SRC" ] && ! grep -q ufs_stub_sha256 "$SRC"; then
            cat >> "$SRC" <<'STUBEOF2'
          extern "C" {
          static int ufs_stub_sha256(const void *a, size_t b, uint8_t c[32]) { (void)a;(void)b;(void)c; return 1; }
          static int ufs_stub_rsa(const uint8_t a[VR_KEY_BYTES], const uint8_t b[32], const uint8_t c[VR_SIGNATURE_BYTES]) { (void)a;(void)b;(void)c; return 1; }
          const uint8_t verified_root_key[VR_KEY_BYTES] = {0};
          const NativeVerifiedBlockPolicy verified_root_policies[1] = {};
          const uint64_t verified_root_policy_count = 0;
          const struct vr_crypto vr_xnu_crypto = { ufs_stub_sha256, ufs_stub_rsa };
          int vr_open(const uint8_t *a, size_t b, const uint8_t c[VR_KEY_BYTES], uint64_t d, const struct vr_crypto *e, struct vr_view *f) { (void)a;(void)b;(void)c;(void)d;(void)e;(void)f; return 1; }
          int vr_verify_block(const struct vr_view *a, uint64_t b, const void *c, size_t d, const struct vr_crypto *e) { (void)a;(void)b;(void)c;(void)d;(void)e; return 1; }
          void boot_progress_poll(void) {}
          }
          STUBEOF2
            echo stub_appended_to_unixnu_source
          fi
          echo "=== PATCH MakeInc.def ==="
          for REF in $(grep -rl -- '-Wl,-headerpad,152' "$TREE/.cache/xnu-work/makedefs" 2>/dev/null); do
            sed -i '' 's/-Wl,-headerpad,152/-Wl,-headerpad,152 -Wl,-undefined,dynamic_lookup/' "$REF" 2>/dev/null || true
            sed -i '' 's/-Wl,-new_linker//g' "$REF" 2>/dev/null || true
            echo "makeinc.def patched $REF count=$(grep -c dynamic_lookup "$REF" || true)"
          done
          echo "=== PATCH MakeInc.kernel LD LINE ==="
          MK="$TREE/.cache/xnu-work/makedefs/MakeInc.kernel"
          if [ -f "$MK" ] && ! grep -q 'undefined,dynamic_lookup' "$MK"; then
            sed -i '' 's|$(LD) $(LDFLAGS_KERNEL) $(LDFLAGS_KERNEL_ONLY)|$(LD) $(LDFLAGS_KERNEL) $(LDFLAGS_KERNEL_ONLY) -Wl,-undefined,dynamic_lookup|g' "$MK" || true
          fi
          echo "makeinc.kernel count=$(grep -c 'undefined,dynamic_lookup' "$MK" || true)"
          grep -n 'undefined,dynamic_lookup' "$MK" | head -3 | cut -c1-170
          echo "=== PATCH END ==="
          # vm_tests.c pulls mach_vm_* that the iOS kernel does not export
          FILES="$TREE/.cache/xnu-work/osfmk/conf/files"
          if [ -f "$FILES" ] && ! grep -q "^#osfmk/vm/vm_tests.c" "$FILES"; then
            sed -i '' 's|^osfmk/vm/vm_tests.c|#osfmk/vm/vm_tests.c|' "$FILES" || true
          fi
          echo "vm_tests disabled: $(grep -c '^#osfmk/vm/vm_tests.c' "$FILES" || true)"
          echo "=== STORAGE ABI AUDIT ==="
          python3 "$TREE/scripts/audit-storage-interface.py" || echo "audit failed"
          echo "=== AUDIT END ==="
          ./unixnu build kernel
          echo "=== LINK ARGS DUMP ==="
          for f in $(find "$TREE" -name '*.linkarguments' 2>/dev/null | head -3); do
            echo "--- $f"
            echo "dynamic_lookup_count=$(grep -o 'dynamic_lookup' "$f" | wc -l)"
            head -c 700 "$f"
            echo
          done
          echo "=== DUMP END ==="
      - name: Build payload
        working-directory: unixnu
        run: ./unixnu build payload --uefi "$GITHUB_WORKSPACE/uefi"
      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shennong-kernel-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            unixnu/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837*
            unixnu/out/shennong/kernel/kernel.macho*
            unixnu/out/shennong/payload/payload.img
            unixnu/out/shennong/payload/payload.json
            unixnu/out/shennong/logs/*.log
  logs:
    needs: kernel
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo "kernel job finished"

